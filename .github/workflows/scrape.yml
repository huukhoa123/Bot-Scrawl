name: Job Scraper Bot

on:
  schedule:
    # Chạy 4 lần/ngày ở phút lẻ (:17) để tránh nghẽn giờ cao điểm :00 của GitHub
    # Giờ VN (UTC+7): 08:17, 12:17, 16:17, 20:17
    - cron: "17 1,5,9,13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy (instant | scrape | digest)"
        required: false
        default: "instant"

permissions:
  contents: write

concurrency:
  group: job-bot-scrape
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'instant' }}"
          python -m src.main --mode "$MODE" --spiders topdev itviec

      - name: Commit updated SQLite DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/jobs.db ]; then
            git add data/jobs.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: update jobs.db [skip ci]"
              git push
            fi
          fi
